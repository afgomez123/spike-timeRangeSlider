<section
  style="
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    margin-bottom: 10px;
  "
>
  <span class="range-time-selection">Elige el rango de tiempo:</span>
  <div
    class="time-range"
    [ngClass]="{ 'time-range-is-no-available': !isRangeAvailable }"
  >
    <span
      >Rango seleccionado: <strong>{{ selectedRange }}</strong></span
    >
  </div>
</section>
<div class="timeline">
  <div class="hours">
    <div class="hour" *ngFor="let hour of hours">{{ hour }}</div>
  </div>
  <div class="timeline-track" #timelineTrack>
    <!-- Bloques de tiempo dinámicos según timeRanges -->
    <div
      *ngFor="let range of timeRanges"
      class="time-block"
      [ngStyle]="{ width: range.width, left: range.left }"
    >
      <!-- {{ range.startTime }} - {{ range.endTime }} -->
    </div>

    <!-- Caja de selección con manejas de redimensionado -->
    <div class="selection-box" #selectionBox>
      <span class="resize-handle left"></span>
      <span class="resize-handle right"></span>
    </div>
  </div>

  <div class="duration-label" #durationLabel></div>
</div>

<div *ngIf="!isRangeAvailable" class="error-message">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
  >
    <path
      d="M4.47012 20.9997H19.5301C21.0701 20.9997 22.0301 19.3297 21.2601 17.9997L13.7301 4.98969C12.9601 3.65969 11.0401 3.65969 10.2701 4.98969L2.74012 17.9997C1.97012 19.3297 2.93012 20.9997 4.47012 20.9997ZM12.0001 13.9997C11.4501 13.9997 11.0001 13.5497 11.0001 12.9997V10.9997C11.0001 10.4497 11.4501 9.99969 12.0001 9.99969C12.5501 9.99969 13.0001 10.4497 13.0001 10.9997V12.9997C13.0001 13.5497 12.5501 13.9997 12.0001 13.9997ZM13.0001 17.9997H11.0001V15.9997H13.0001V17.9997Z"
      fill="#FCC736"
    />
  </svg>
  El rango que seleccionaste tiene un área de video no disponible. Solamente te
  enviaremos los videos que están disponibles.
</div>

<!-- Botón para confirmar selección -->
<button
  (click)="calculateSelectedRange()"
  [disabled]="!isRangeAvailable"
  class="confirm-button"
>
  Continuar
</button>
